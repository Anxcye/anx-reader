name: Build Linux

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      flutter_version:
        required: true
        type: string

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build pkg-config

      - name: Build Linux bundle
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          flutter build linux --release

      - name: Package Linux bundle
        run: |
          tar -C build/linux/x64/release/bundle \
            -cJf build/linux/Anx-Reader-linux-x64-${{ inputs.version }}.tar.xz .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: build/linux/*.tar.xz
          if-no-files-found: error
