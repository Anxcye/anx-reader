name: Build Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 1.2.0)'
        required: true
        type: string
        default: '1.0.0'
      flutter_version:
        description: 'Flutter 版本 (留空 = 最新稳定版)'
        required: false
        type: string
        default: ''
  push:
      tags:
        - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version }}

      - name: Get Dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
          check-latest: true

      - name: Generate test keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/keystore.jks \
            -storetype JKS \
            -storepass android \
            -keypass android \
            -alias testkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Test, OU=Test, O=Test, L=Test, ST=Test, C=US"

      - name: Setup Android signing (test key)
        run: |
          echo "storeFile=keystore.jks" > android/key.properties
          echo "storePassword=android" >> android/key.properties
          echo "keyAlias=testkey" >> android/key.properties
          echo "keyPassword=android" >> android/key.properties

      - name: Build for Android
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          flutter build apk --release
          flutter build apk --split-per-abi

      - name: Rename builds
        run: |
          cd build/app/outputs/flutter-apk
          mv app-armeabi-v7a-release.apk Anx-Reader-android-${{ inputs.version }}-armeabi-v7a.apk
          mv app-arm64-v8a-release.apk Anx-Reader-android-${{ inputs.version }}-arm64-v8a.apk
          mv app-x86_64-release.apk Anx-Reader-android-${{ inputs.version }}-x86_64.apk
          mv app-release.apk Anx-Reader-android-${{ inputs.version }}-universal.apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts-${{ inputs.version }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  release:
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-artifacts-${{ inputs.version }}
          path: apks

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="${SHORT_SHA}"
          echo "Tag: ${TAG}"

          # 同一个 commit 重复构建时，先删掉旧的 release 和 tag
          gh release delete "${TAG}" --yes --cleanup-tag --repo "${GITHUB_REPOSITORY}" || true

          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Anx Reader ${VERSION} (${TAG})" \
            --notes "自动构建: commit ${GITHUB_SHA}" \
            --latest \
            apks/*.apk